# Xot-Dog POS — Phase 2 local stack.
#   docker compose up -d --build     → web http://127.0.0.1:8080, API http://127.0.0.1:8010/docs
# Credentials below are for LOCAL DEVELOPMENT ONLY.
name: xotdog

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xotdog
      POSTGRES_PASSWORD: xotdog_dev_password
      POSTGRES_DB: xotdog
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xotdog -d xotdog"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    environment:
      DATABASE_URL: postgresql+psycopg://xotdog:xotdog_dev_password@db:5432/xotdog
      TEST_DATABASE_URL: postgresql+psycopg://xotdog:xotdog_dev_password@db:5432/xotdog_test
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-change-me}
      BUSINESS_TIMEZONE: Asia/Tashkent
      DEMO_MODE: "true"
      DEMO_PIN_HINTS: "true"
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8080,http://localhost:8080
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
